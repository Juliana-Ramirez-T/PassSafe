{% extends 'base.html' %}
{% block title %}Eliminar Credencial{% endblock %}
{% block content %}
<div class="modal-page">
  <div class="modal-card">
    <h1>Eliminar Credencial</h1>
    <p>¿Estás seguro de que deseas eliminar <strong>{{ credential.service_name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <div class="action-row">
        <a href="{% url 'vault:dashboard' %}" class="button ghost">Cancelar</a>
        <button class="button danger" type="submit">Eliminar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
